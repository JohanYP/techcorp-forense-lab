; Configuración PHP del portal TechCorp
expose_php = On                 ; mala práctica: anuncia "X-Powered-By: PHP/8.3.30"
display_errors = Off
log_errors = On
error_reporting = E_ALL
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 8M

; Registro estructurado, reloj de laboratorio y simulador del incidente
auto_prepend_file = /opt/techcorp-lab/bootstrap.php

; Sesiones (el seguimiento de progreso de subida viene activo por defecto en PHP)
session.name = PHPSESSID
session.upload_progress.enabled = On
session.gc_probability = 1
session.gc_divisor = 1000

opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
